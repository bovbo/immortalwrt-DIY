name: OpenWrt Builder

# 触发方式:repository_dispatch 允许被外部请求触发,workflow_dispatch 允许在 Actions 页面手动点 "Run workflow"
on:
  repository_dispatch:
  workflow_dispatch:

# 全局环境变量(原文件里这里重复写了两个 env:,已合并成一个)
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt   # 源码仓库地址
  REPO_BRANCH: openwrt-25.12                              # 源码分支;immortalwrt 的分支名前缀是 openwrt- 不是 immortalwrt-,原文件写的 immortalwrt-25.12 是错的,会导致 clone 失败
  FEEDS_CONF: feeds.conf.default                          # 仓库根目录放这个文件名时会整份替换源码自带的 feeds.conf.default;不放此文件则走源码默认 feeds,配合 diy-part1.sh 追加第三方源
  CONFIG_FILE: .config                                    # 仓库根目录的编译配置文件,会被搬进源码目录当 .config 用
  DIY_P1_SH: diy-part1.sh                                 # feeds update 之前执行的自定义脚本(加第三方 feeds 源等)
  DIY_P2_SH: diy-part2.sh                                 # make defconfig 之前执行的自定义脚本(改默认 IP、默认主题等)
  UPLOAD_BIN_DIR: false                                   # 是否把整个 bin 目录(含中间产物)打包上传,一般不需要,固件包已经够用
  UPLOAD_FIRMWARE: true                                   # 是否把编译好的固件打包成 Artifact 上传
  UPLOAD_RELEASE: true                                    # 是否把固件发布到仓库的 Releases 页面
  TZ: Asia/Shanghai                                       # 编译环境时区,影响固件里的默认时区和文件时间戳

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 拉取当前仓库(拿到 .config、diy-part1.sh、diy-part2.sh、files/ 等自定义内容)
      - name: Checkout
        uses: actions/checkout@main

      # 清理 Runner 里用不到的预装软件腾空间、装编译 OpenWrt 需要的编译工具链依赖
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      # 把 ImmortalWrt 源码拉到 /workdir,再软链接回工作目录,避免占用 Runner 系统盘空间
      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      # 如果仓库根目录有自定义 feeds.conf.default 就整份替换源码自带的;然后执行 diy-part1.sh(追加 daede/smpackage 等第三方源)
      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      # 拉取上面 feeds.conf.default 里声明的所有第三方插件源码
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      # 把拉取到的插件建立软链接安装进源码目录,make menuconfig/defconfig 才能识别到
      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 把仓库根目录的 files/(自定义配置覆盖)和 .config(编译配置)搬进源码目录,再执行 diy-part2.sh(改默认 IP、默认主题等)
      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      # 根据 .config 把所有需要的源码包下载下来;顺手删掉下载失败的空文件/残缺文件,避免编译阶段报校验错误
      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 正式编译;多线程编译失败则自动降级单线程重试,单线程还失败就打印详细日志方便排错
      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # 编译完打印磁盘占用,方便排查空间不足问题;!cancelled() 保证即使前面步骤失败也会执行,便于诊断
      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # 可选:把完整 bin 目录(含中间产物)打包成 Artifact,默认关闭(UPLOAD_BIN_DIR: false)
      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      # 整理固件产物目录,删掉里面的 packages 子目录(单个 ipk/apk 包文件),只留固件本体
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # 把整理好的固件打包成 Artifact,供 Actions 页面手动下载
      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # 生成一个以当前时间命名的 Release 标签
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT
          # 原文件这里有一行引用了不存在的 UPLOAD_GOFILE 变量和不存在的 gofile 步骤(steps.gofile.outputs.url),
          # 那是残留的 GoFile 上传功能代码,本工作流没有对应步骤,写法本身也不合法(单中括号不支持 &&),
          # 留着会导致这一步直接执行失败、连累后面 Release 上传都跑不了,已删除。

      # 把固件文件发布到仓库 Releases 页面
      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      # 清理历史 workflow 运行记录,只保留最近 2 次,避免 Actions 页面记录越堆越多
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2

      # 清理旧的 Release,只保留最新 3 个(含固件包),避免仓库 Releases 页面无限膨胀占用仓库配额
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
